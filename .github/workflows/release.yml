name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.3.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-amd64:
    name: Build and publish portable package
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Go build and module directories
        uses: actions/cache@v4
        with:
          path: |
            .tools/gocache
            .tools/gomodcache
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = '${{ github.ref_name }}' }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+') { throw "Release tag must look like v1.3.0, got '$tag'" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test, vet and package
        shell: pwsh
        run: ./build.ps1

      - name: Inspect package
        id: package
        shell: pwsh
        run: |
          $exe = 'dist\DNSMonitor\dns-monitor.exe'
          $zip = 'dist\DNSMonitor-windows-amd64.zip'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'dns-monitor.exe is missing from the package' }
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Portable zip was not created' }
          $app = (& $exe --version) -join ' '
          $size = (Get-Item -LiteralPath $zip).Length
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "app=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $reader = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $bad = @($reader.Entries | ForEach-Object { $_.FullName } | Where-Object { $_ -match '(^|/)(data|logs)/' -or $_ -match '\.(db|db-wal|db-shm)$' })
          } finally {
            $reader.Dispose()
          }
          if ($bad.Count -gt 0) { throw "Release zip must not contain runtime data/logs: $($bad -join ',')" }
          $summary = @(
            $app
            ('Package size: {0:N2} MiB' -f ($size / 1MB))
            ('SHA256: {0}' -f $hash)
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSMonitor-windows-amd64
          path: dist/DNSMonitor-windows-amd64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          APP: ${{ steps.package.outputs.app }}
          SIZE: ${{ steps.package.outputs.size }}
          HASH: ${{ steps.package.outputs.hash }}
        run: |
          $zip = 'dist\DNSMonitor-windows-amd64.zip'
          $notes = @(
            "Windows 10/11 与 Windows Server 2016 及以上 amd64 便携包，无需安装运行时。"
            ""
            "- 应用内版本：$env:APP"
            "- 包大小：{0:N2} MiB" -f ($env:SIZE / 1MB)
            "- 附件：DNSMonitor-windows-amd64.zip"
            "- SHA256：$env:HASH"
            ""
            "### 变更"
            "- **中/英语言切换**：网页默认跟随浏览器语言（中文或英文），登录页与左下角可随时切换，选择保存在本地并跨刷新保持；总览、配置、服务、详情、导入与升级判定等全部界面均可翻译"
            "- **Windows 服务接入修复**：服务安装/管理不再依赖 DOGGO 是否就绪，失败与原因更清晰；更改安装目录后请先卸载再安装"
            "- **修复启动偶发「invalid status history range」**：监控循环启动时的时间范围改用同一时刻计算，避免毫秒级偏差触发 30 天保留上限校验"
            ""
            "解压后将 dns-monitor.exe 所在目录整体使用；双击 start.cmd 启动，网页默认 http://127.0.0.1:8080。"
            "升级前请退出旧程序；便携包不包含运行时数据（data/logs），覆盖解压不会触碰你已有的监测数据。"
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesFile, ($notes -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $arguments = @($env:TAG, $zip, '--title', "DNS Monitor $env:TAG", '--notes-file', $notesFile, '--latest')
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $arguments += @('--target', $env:GITHUB_SHA) }
          gh release create @arguments
